<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧽</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="海绵宝宝 Roguelike - 一款2D横版动作闯关游戏" />
    <meta name="theme-color" content="#1a1a2e" />
    <title>🧽 海绵宝宝 Roguelike - 保卫蟹堡王</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        touch-action: none;
      }

      body {
        background: linear-gradient(180deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: 'Segoe UI', Arial, sans-serif;
        position: relative;
      }

      /* 海底气泡动画背景 */
      body::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image: 
          radial-gradient(circle at 20% 80%, rgba(255,255,255,0.05) 0%, transparent 50%),
          radial-gradient(circle at 80% 20%, rgba(255,255,255,0.05) 0%, transparent 50%),
          radial-gradient(circle at 40% 40%, rgba(255,255,255,0.03) 0%, transparent 30%);
        pointer-events: none;
        animation: bubbleFloat 20s ease-in-out infinite;
      }

      @keyframes bubbleFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
      }

      #app {
        text-align: center;
        z-index: 1;
        padding: 20px;
      }

      .game-title {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 15px;
      }

      .game-title h1 {
        color: #FFD700;
        font-size: clamp(24px, 5vw, 36px);
        text-shadow: 
          0 0 10px rgba(255, 215, 0, 0.5),
          2px 2px 4px rgba(0, 0, 0, 0.8);
        letter-spacing: 2px;
      }

      .game-title .emoji {
        font-size: clamp(30px, 6vw, 48px);
        animation: bounce 2s ease-in-out infinite;
      }

      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }

      #game-container {
        border: 3px solid #FFD700;
        border-radius: 12px;
        box-shadow: 
          0 0 30px rgba(255, 215, 0, 0.3),
          0 20px 60px rgba(0, 0, 0, 0.6),
          inset 0 0 30px rgba(0, 0, 0, 0.3);
        background: #000;
        overflow: hidden;
        position: relative;
      }

      #game-container::before {
        content: '';
        position: absolute;
        top: -2px;
        left: -2px;
        right: -2px;
        bottom: -2px;
        background: linear-gradient(45deg, #FFD700, #FFA500, #FF6347, #FFD700);
        border-radius: 14px;
        z-index: -1;
        opacity: 0;
        transition: opacity 0.3s;
      }

      #game-container:hover::before {
        opacity: 0.5;
      }

      .info {
        color: rgba(255, 255, 255, 0.8);
        margin-top: 20px;
        font-size: 14px;
      }

      .info p {
        margin: 8px 0;
      }

      .controls {
        display: flex;
        justify-content: center;
        gap: 15px;
        flex-wrap: wrap;
        margin-top: 10px;
      }

      .control-key {
        background: rgba(255, 255, 255, 0.1);
        padding: 6px 14px;
        border-radius: 6px;
        font-size: 13px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        transition: all 0.2s;
      }

      .control-key:hover {
        background: rgba(255, 255, 255, 0.2);
        border-color: rgba(255, 215, 0, 0.5);
      }

      .control-key kbd {
        background: rgba(255, 215, 0, 0.3);
        padding: 2px 8px;
        border-radius: 4px;
        font-family: monospace;
        font-weight: bold;
        color: #FFD700;
      }

      .footer {
        margin-top: 15px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.5);
      }

      .footer a {
        color: rgba(255, 215, 0, 0.7);
        text-decoration: none;
        transition: color 0.2s;
      }

      .footer a:hover {
        color: #FFD700;
      }

      /* 移动端适配 */
      @media (max-width: 850px) {
        #app {
          padding: 10px;
        }
        
        .game-title {
          margin-bottom: 10px;
        }

        .info {
          margin-top: 10px;
        }

        .controls {
          display: none;
        }

        .mobile-hint {
          display: block;
          color: rgba(255, 255, 255, 0.6);
          font-size: 12px;
          margin-top: 10px;
        }
      }

      @media (min-width: 851px) {
        .mobile-hint {
          display: none;
        }
      }

      /* 加载动画 */
      .loading-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #1a1a2e;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        transition: opacity 0.5s;
      }

      .loading-overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 215, 0, 0.3);
        border-top-color: #FFD700;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .loading-text {
        color: #FFD700;
        margin-top: 15px;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="game-title">
        <span class="emoji">🧽</span>
        <h1>海绵宝宝 Roguelike</h1>
      </div>
      <div id="game-container">
        <div class="loading-overlay" id="loading">
          <div class="loading-spinner"></div>
          <div class="loading-text">加载中...</div>
        </div>
      </div>
      <div class="info">
        <div class="controls">
          <span class="control-key"><kbd>← →</kbd> 移动</span>
          <span class="control-key"><kbd>空格</kbd> 跳跃</span>
          <span class="control-key"><kbd>X</kbd> 攻击</span>
        </div>
        <p class="mobile-hint">📱 触屏设备将显示虚拟按钮</p>
      </div>
      <div class="footer">
        <p>Phaser 3 + Vite + TypeScript | <a href="#">v0.2.0</a></p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // 游戏加载完成后隐藏加载动画
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loading = document.getElementById('loading');
          if (loading) {
            loading.classList.add('hidden');
          }
        }, 1000);
      });
    </script>
  </body>
</html>
