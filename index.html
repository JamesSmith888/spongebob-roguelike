<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>海绵宝宝 Roguelike - 保卫蟹堡王</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: Arial, sans-serif;
      }

      #app {
        text-align: center;
      }

      #game-container {
        border: 4px solid #333;
        border-radius: 8px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        background: #000;
      }

      h1 {
        color: #fff;
        margin-bottom: 20px;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
      }

      .info {
        color: #fff;
        margin-top: 20px;
        font-size: 14px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>🧽 海绵宝宝 Roguelike</h1>
      <div id="game-container"></div>
      <div class="info">
        <p>Phaser 3.90 + Vite + TypeScript</p>
        <p>使用方向键移动，空格跳跃，X键攻击</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
