<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 50" width="320" height="50">
  <defs>
    <!-- 海绵宝宝身体基座 -->
    <g id="body">
      <!-- 腿 -->
      <rect x="12" y="32" width="4" height="14" fill="#FFFF00" stroke="#000" stroke-width="0.5"/>
      <rect x="24" y="32" width="4" height="14" fill="#FFFF00" stroke="#000" stroke-width="0.5"/>
      <!-- 袜子 -->
      <rect x="12" y="38" width="4" height="4" fill="#FFFFFF" stroke="#000" stroke-width="0.5"/>
      <rect x="24" y="38" width="4" height="4" fill="#FFFFFF" stroke="#000" stroke-width="0.5"/>
      <path d="M12 39 h4 M12 41 h4 M24 39 h4 M24 41 h4" stroke="#FF0000" stroke-width="0.5"/>
      <!-- 鞋子 -->
      <path d="M10 44 h8 v4 h-8 z" fill="#000000"/>
      <path d="M22 44 h8 v4 h-8 z" fill="#000000"/>
      
      <!-- 裤子 -->
      <rect x="5" y="30" width="30" height="8" fill="#8B4513" stroke="#000" stroke-width="0.5"/>
      <rect x="5" y="30" width="30" height="2" fill="#000" stroke="none" opacity="0.2" style="mix-blend-mode: multiply;"/> 
      
      <!-- 衬衫 -->
      <rect x="5" y="24" width="30" height="6" fill="#FFFFFF" stroke="#000" stroke-width="0.5"/>
      
      <!-- 身体 (海绵) -->
      <rect x="5" y="2" width="30" height="22" fill="#FFFF00" stroke="#000" stroke-width="0.5"/>
      <!-- 孔洞 -->
      <circle cx="10" cy="8" r="1.5" fill="#BDB76B" opacity="0.6"/>
      <circle cx="28" cy="18" r="1.5" fill="#BDB76B" opacity="0.6"/>
      <circle cx="8" cy="20" r="1" fill="#BDB76B" opacity="0.6"/>
      <circle cx="30" cy="5" r="2" fill="#BDB76B" opacity="0.6"/>
      
      <!-- 领带 -->
      <path d="M18 24 l2 8 l2 -8 z" fill="#FF0000" stroke="#000" stroke-width="0.5"/>
      <path d="M16 24 l4 2 l4 -2" fill="none" stroke="#000" stroke-width="0.5"/>
    </g>

    <!-- 脸部 -->
    <g id="face">
      <!-- 眼睛 -->
      <circle cx="14" cy="10" r="5" fill="#FFFFFF" stroke="#000" stroke-width="0.5"/>
      <circle cx="26" cy="10" r="5" fill="#FFFFFF" stroke="#000" stroke-width="0.5"/>
      <!-- 虹膜 -->
      <circle cx="15" cy="10" r="2" fill="#87CEEB"/>
      <circle cx="25" cy="10" r="2" fill="#87CEEB"/>
      <!-- 瞳孔 -->
      <circle cx="15" cy="10" r="1" fill="#000000"/>
      <circle cx="25" cy="10" r="1" fill="#000000"/>
      <!-- 睫毛 -->
      <path d="M14 5 v-2 M12 6 l-1 -2 M16 6 l1 -2" stroke="#000" stroke-width="0.5"/>
      <path d="M26 5 v-2 M24 6 l-1 -2 M28 6 l1 -2" stroke="#000" stroke-width="0.5"/>
      
      <!-- 鼻子 -->
      <path d="M19 12 q1 -3 3 0" fill="none" stroke="#000" stroke-width="0.5" fill-opacity="0"/>
      <path d="M19 12 q1 -3 3 0" fill="#FFFF00"/>
      
      <!-- 嘴巴 -->
      <path d="M12 16 q8 6 16 0" fill="none" stroke="#000" stroke-width="0.5"/>
      <!-- 牙齿 -->
      <rect x="17" y="18" width="2" height="3" fill="#FFFFFF" stroke="#000" stroke-width="0.5"/>
      <rect x="21" y="18" width="2" height="3" fill="#FFFFFF" stroke="#000" stroke-width="0.5"/>
      <!-- 脸颊 -->
      <circle cx="10" cy="16" r="1.5" fill="#FF6347" opacity="0.4"/>
      <circle cx="30" cy="16" r="1.5" fill="#FF6347" opacity="0.4"/>
      <path d="M9 15 q1 -1 2 0 M29 15 q1 -1 2 0" fill="none" stroke="#FF0000" stroke-width="0.2"/>
    </g>
    
    <!-- 手臂 (下垂) -->
    <g id="arms-idle">
       <path d="M5 15 l-2 8" stroke="#FFFF00" stroke-width="2" stroke-linecap="round"/>
       <path d="M35 15 l2 8" stroke="#FFFF00" stroke-width="2" stroke-linecap="round"/>
       <circle cx="3" cy="24" r="2" fill="#FFFF00"/>
       <circle cx="37" cy="24" r="2" fill="#FFFF00"/>
    </g>

    <!-- 手臂 (行走) -->
    <g id="arms-walk">
       <path d="M5 15 l-3 5" stroke="#FFFF00" stroke-width="2" stroke-linecap="round"/>
       <path d="M35 15 l3 -5" stroke="#FFFF00" stroke-width="2" stroke-linecap="round"/>
    </g>
    
    <!-- 手臂 (攻击) -->
    <g id="arms-attack">
       <path d="M5 15 l-4 -4" stroke="#FFFF00" stroke-width="2" stroke-linecap="round"/>
       <path d="M35 15 l8 0" stroke="#FFFF00" stroke-width="2" stroke-linecap="round"/>
       <!-- 拳套/手套 -->
       <circle cx="44" cy="15" r="4" fill="#FF0000"/>
    </g>
  </defs>

  <!-- Frame 1: Idle 1 -->
  <g transform="translate(0, 0)">
    <use href="#body"/>
    <use href="#face"/>
    <use href="#arms-idle"/>
  </g>

  <!-- Frame 2: Idle 2 (Squash) -->
  <g transform="translate(40, 1)">
    <use href="#body" transform="scale(1, 0.96) translate(0, 1)"/>
    <use href="#face" transform="translate(0, 1)"/>
    <use href="#arms-idle"/>
  </g>

  <!-- Frame 3: Walk 1 -->
  <g transform="translate(80, 0)">
    <use href="#body"/>
    <use href="#face"/>
    <use href="#arms-walk"/>
    <!-- 覆盖腿部实现行走效果 -->
    <rect x="10" y="32" width="20" height="16" fill="#87CEEB" opacity="0"/> <!-- Mask placeholder -->
    <!-- 重绘腿 -->
    <path d="M14 32 l-4 10 h4 l2 -10" fill="#FFFF00" stroke="#000" stroke-width="0.5"/>
    <path d="M26 32 l4 10 h-4 l-2 -10" fill="#FFFF00" stroke="#000" stroke-width="0.5"/>
    <path d="M8 42 h8 v4 h-8 z" fill="#000000"/>
    <path d="M28 42 h8 v4 h-8 z" fill="#000000"/>
  </g>

  <!-- Frame 4: Walk 2 -->
  <g transform="translate(120, 0)">
    <use href="#body" transform="translate(0, -1)"/>
    <use href="#face" transform="translate(0, -1)"/>
    <use href="#arms-walk" transform="scale(-1, 1) translate(-40, 0)"/>
    <!-- 重绘腿 -->
    <path d="M14 32 l2 8 h4 l-2 -8" fill="#FFFF00" stroke="#000" stroke-width="0.5"/>
    <path d="M26 32 l-2 8 h-4 l2 -8" fill="#FFFF00" stroke="#000" stroke-width="0.5"/>
    <path d="M14 40 h8 v4 h-8 z" fill="#000000"/>
    <path d="M22 40 h8 v4 h-8 z" fill="#000000"/>
  </g>

  <!-- Frame 5: Jump -->
  <g transform="translate(160, 0)">
    <use href="#body" transform="translate(0, -4)"/>
    <use href="#face" transform="translate(0, -4)"/>
    <path d="M5 11 l-4 -6" stroke="#FFFF00" stroke-width="2" stroke-linecap="round"/>
    <path d="M35 11 l4 -6" stroke="#FFFF00" stroke-width="2" stroke-linecap="round"/>
    <!-- 弯曲的腿 -->
    <path d="M14 28 l-4 6 h4" fill="none" stroke="#FFFF00" stroke-width="4"/>
    <path d="M26 28 l4 6 h-4" fill="none" stroke="#FFFF00" stroke-width="4"/>
    <path d="M8 34 h8 v4 h-8 z" fill="#000000"/>
    <path d="M28 34 h8 v4 h-8 z" fill="#000000"/>
  </g>

  <!-- Frame 6: Attack 1 -->
  <g transform="translate(200, 0)">
    <use href="#body"/>
    <use href="#face"/>
    <use href="#arms-attack"/>
  </g>

  <!-- Frame 7: Attack 2 -->
  <g transform="translate(240, 0)">
    <use href="#body" transform="translate(2, 0)"/>
    <use href="#face" transform="translate(2, 0)"/>
    <path d="M7 15 l-4 -4" stroke="#FFFF00" stroke-width="2" stroke-linecap="round"/>
    <path d="M37 15 l12 0" stroke="#FFFF00" stroke-width="2" stroke-linecap="round"/>
    <circle cx="50" cy="15" r="5" fill="#FF0000"/>
    <!-- 愤怒表情 -->
    <path d="M14 8 l4 2" stroke="#000" stroke-width="0.5"/>
    <path d="M26 8 l-4 2" stroke="#000" stroke-width="0.5"/>
  </g>
  
  <!-- Frame 8: Hurt -->
  <g transform="translate(280, 0)">
    <use href="#body"/>
    <!-- 晕眩眼 -->
    <path d="M12 8 l4 4 M16 8 l-4 4" stroke="#000" stroke-width="1"/>
    <path d="M24 8 l4 4 M28 8 l-4 4" stroke="#000" stroke-width="1"/>
    <path d="M18 20 q2 -2 4 0" fill="none" stroke="#000" stroke-width="1"/>
  </g>

</svg>